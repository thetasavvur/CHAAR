<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>
    <form action="/save.php">
        <label for="USERNAME">Username: </label>
        <input type="text" id="USERNAME" name="username" placeholder="Enter an Email">
        <br><br>
        <label for="PASSWORD">Password: </label>
        <input type="password" id="PASSWORD" name="password">
        <br><br>
        Select Gender :
        <label for="MALE">MALE</label>
        <input type="radio" id="MALE" name="GENDER" value="MALE">
        <label for="FEMALE">FEMALE</label>
        <input type="radio" id="FEMALE" name="GENDER" value="FEMALE">
        <label for="OTHERS">OTHERS</label>
        <input type="radio" id="OTHERS" name="GENDER" value="OTHERS">
        <br><br>
        <label for="Dob" >Date Of Birth : </label>
        <input type="date" name="DOB" id="Dob">
        <br><br>
        <label for="State">Select The State:</label>
        <select name="State" id="STATE">
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Delhi">Delhi</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Kerela">Kerela</option>
            <option value="Jammu & Kashmir">Jammu & Kashmir</option>
            <option value="Himachal Pradesh">Himachal Pradesh</option>
            <option value="Punjab">Punjab</option>
            <option value="Haryana">Haryana</option>
            <option value="Uttrakhand">Uttrakhand</option>
            <option value="Rajasthan">Rajasthan</option>
            <option value="Bihar">Bihar</option>
            <option value="Sikkim">Sikkim</option>
            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
            <option value="Assam">Assam</option>
            <option value="Meghalaya">Meghalaya</option>
            <option value="Nagaland">Nagaland</option>
            <option value="Manipur">Manipur</option>
            <option value="Mizoram">Mizoram</option>
            <option value="Tripura">Tripura</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Jharkhand">Jharkhand</option>
            <option value="Chattisgarh">Chattisgarh</option>
            <option value="Madhya Pradesh">Madhya Pradesh</option>
            <option value="Gujrat">Gujrat</option>
            <option value="Maharastra">Maharastra</option>
            <option value="Odisha">Odisha</option>
            <option value="Telangana">Telangana</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Goa">Goa</option>
            <option value="Andra Pradesh">Andra Pradesh</option>
        </select>
        <br><br>
        <label for="SEARCHING FOR">Searching For : </label>
        <select name="Searching For" id="SEARCHING FOR">
            <option value="Friend">Friend</option>
            <option value="Date">Date</option>
            <option value="Nothing Serious">Nothing Serious</option>
        </select>
        <br><br>
        <label for="NUMBER">Contact No.:</label>
        <input type="tel">
        <br><br>
        <label for="Socail Media Handle">Socail Media Handle: </label>
        <input type="text" name="Social Media ID" id="Socail Media Handle">
        <br><br>
        <input type="submit">
    </form>
</body>
</html>
